name: Bump app version

on:
  workflow_dispatch:
    inputs:
      increment-type:
        description: Part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update version
        id: version
        uses: abhishek-3289/android-version-increment@v1
        with:
          increment-type: ${{ inputs.increment-type }}
          update-release-notes: true

      - name: Open pull request
        env:
          NEW_VERSION: ${{ steps.version.outputs.new-version }}
          BASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="version/v$NEW_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "Bump version to $NEW_VERSION"
          git push -u origin "$BRANCH"
          gh pr create --base "$BASE_BRANCH" --head "$BRANCH" \
            --title "Bump version to $NEW_VERSION" \
            --body "Automated version bump to \`$NEW_VERSION\`."
