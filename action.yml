name: Android App Version Increment
description: Increment android application version
author: Abhishek Bansal

branding:
  icon: arrow-up-right
  color: green

inputs:
  increment-type:
    description: Provide increment type [patch, minor, major]
    required: false
    default: patch
  update-release-notes:
    description: Provide true if release notes need to be updated; Please create gradle task updateReleaseNotesVersion
    required: false
    default: 'false'
  setup-java:
    description: Provide false to skip Java setup when the workflow already sets up a JDK
    required: false
    default: 'true'
  java-version:
    description: JDK version used to run Gradle
    required: false
    default: '17'
  java-distribution:
    description: JDK distribution passed to actions/setup-java
    required: false
    default: zulu
  working-directory:
    description: Directory containing the gradlew wrapper
    required: false
    default: '.'
  github-token:
    description: Token passed to gradle/actions/setup-gradle for GitHub API access
    required: false
    default: ${{ github.token }}

outputs:
  latest-tag:
    description: Latest tag or default v0.0.0 if tag does not exist
    value: ${{ steps.version.outputs.latest_tag }}
  tag-version:
    description: Tag version without v.
    value: ${{ steps.version.outputs.old_version }}
  new-version:
    description: Incremented version
    value: ${{ steps.version.outputs.new_version }}
  new-version-major:
    description: Incremented version major
    value: ${{ steps.version.outputs.major_version }}
  new-version-minor:
    description: Incremented version minor
    value: ${{ steps.version.outputs.minor_version }}
  new-version-patch:
    description: Incremented version patch
    value: ${{ steps.version.outputs.patch_version }}

runs:
  using: composite
  steps:
    - name: Fetch tag and increment version
      id: version
      shell: bash
      env:
        INCREMENT_TYPE: ${{ inputs.increment-type }}
      run: '"$GITHUB_ACTION_PATH/version_script.sh" "$INCREMENT_TYPE"'

    - name: Setup Java
      if: inputs.setup-java == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        github-token: ${{ inputs.github-token }}

    - name: Increment app version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MAJOR: ${{ steps.version.outputs.major_version }}
        MINOR: ${{ steps.version.outputs.minor_version }}
        PATCH: ${{ steps.version.outputs.patch_version }}
      run: ./gradlew incrementBuildMeta -Dversion.major="$MAJOR" -Dversion.minor="$MINOR" -Dversion.patch="$PATCH"

    - name: Update release notes
      if: inputs.update-release-notes == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ./gradlew updateReleaseNotesVersion
