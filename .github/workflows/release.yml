name: Release

on:
  workflow_dispatch:
    inputs:
      increment-type:
        description: Part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Tag and publish release
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Calculate next version
        id: version
        env:
          INPUT_INCREMENT-TYPE: ${{ inputs.increment-type }}
        run: node src/index.js

      - name: Create release
        env:
          TAG: v${{ steps.version.outputs.new-version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

      - name: Move major version tag
        env:
          VERSION: ${{ steps.version.outputs.new-version }}
          MAJOR: ${{ steps.version.outputs.new-version-major }}
        run: |
          git tag -f "v$MAJOR" "$GITHUB_SHA"
          git push -f origin "refs/tags/v$MAJOR"
          echo "Released v$VERSION and moved v$MAJOR" >> "$GITHUB_STEP_SUMMARY"
